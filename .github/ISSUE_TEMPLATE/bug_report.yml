name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected and actual behaviour. Redact all secrets and device identifiers.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: input
    id: deployment
    attributes:
      label: Deployment mode (Docker Compose or native)
    validations:
      required: true
  - type: input
    id: coordinator
    attributes:
      label: Coordinator model and adapter type
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Never include passwords, Zigbee network keys, coordinator backups, or personal data.
